services:
  redis:
    image: redis:8.2-alpine
    container_name: automation-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: automation-agent-worker

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: